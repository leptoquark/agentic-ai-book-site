<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">Confini di controllo e traccia di audit di un sistema agentico</title><desc id="desc">Il modello propone un'azione. Un gate applicativo verifica policy e argomenti. Per azioni sensibili interviene una persona. Lo strumento esegue e ogni fase scrive eventi nell'audit trail.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10" fill="#ff875b"/></marker><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1c2434"/><stop offset="1" stop-color="#10131c"/></linearGradient></defs>
<rect width="1000" height="440" rx="24" fill="url(#bg)"/>
<g stroke="#ff875b" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M225 145H285"/><path d="M485 145H545"/><path d="M745 145H805"/></g>
<g stroke="#8190a8" stroke-width="2" stroke-dasharray="7 7" fill="none" marker-end="url(#arrow)"><path d="M130 195V330"/><path d="M385 195V330"/><path d="M645 195V330"/><path d="M890 195V330"/></g>
<g font-family="Arial,sans-serif" text-anchor="middle"><rect x="35" y="94" width="190" height="100" rx="16" fill="#303d50" stroke="#8190a8"/><text x="130" y="138" font-size="21" font-weight="700" fill="#fff">Modello</text><text x="130" y="166" font-size="15" fill="#cad3df">propone</text>
<rect x="285" y="94" width="200" height="100" rx="16" fill="#ff6b35"/><text x="385" y="138" font-size="20" font-weight="700" fill="#14171e">Gate applicativo</text><text x="385" y="166" font-size="15" fill="#14171e">policy + validazione</text>
<rect x="545" y="94" width="200" height="100" rx="16" fill="#49352f" stroke="#ff875b"/><text x="645" y="138" font-size="20" font-weight="700" fill="#fff">Persona</text><text x="645" y="166" font-size="15" fill="#ffcfb7">se azione sensibile</text>
<rect x="805" y="94" width="170" height="100" rx="16" fill="#303d50" stroke="#8190a8"/><text x="890" y="138" font-size="20" font-weight="700" fill="#fff">Strumento</text><text x="890" y="166" font-size="15" fill="#cad3df">esegue</text>
<rect x="35" y="330" width="940" height="65" rx="15" fill="#222c3b" stroke="#8190a8"/><text x="505" y="370" font-size="20" font-weight="700" fill="#fff">Audit trail: identità · versioni · argomenti · esito · approvazioni</text></g>
<text x="35" y="38" fill="#ff9b75" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">GOVERNANCE / OGNI EFFETTO HA UN CONFINE</text>
</svg>
