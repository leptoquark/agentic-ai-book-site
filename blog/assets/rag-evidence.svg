<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">Pipeline RAG con evidenze versionate</title><desc id="desc">La domanda passa al recupero, che legge documenti con identificativo e versione. I passaggi vengono forniti al modello. La risposta viene verificata rispetto alle fonti prima della consegna.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10" fill="#ff875b"/></marker><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1c2434"/><stop offset="1" stop-color="#10131c"/></linearGradient></defs>
<rect width="1000" height="430" rx="24" fill="url(#bg)"/>
<g stroke="#ff875b" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M225 170H275"/><path d="M455 170H505"/><path d="M685 170H735"/><path d="M365 306V234"/></g>
<g font-family="Arial,sans-serif" text-anchor="middle"><rect x="35" y="120" width="190" height="100" rx="16" fill="#ff6b35"/><text x="130" y="164" font-size="21" font-weight="700" fill="#14171e">Domanda</text><text x="130" y="191" font-size="15" fill="#14171e">intento esplicito</text>
<rect x="275" y="120" width="180" height="100" rx="16" fill="#303d50" stroke="#8190a8"/><text x="365" y="164" font-size="21" font-weight="700" fill="#fff">Recupero</text><text x="365" y="191" font-size="15" fill="#cad3df">passaggi pertinenti</text>
<rect x="275" y="306" width="180" height="82" rx="16" fill="#49352f" stroke="#ff875b"/><text x="365" y="340" font-size="18" font-weight="700" fill="#fff">Fonti</text><text x="365" y="367" font-size="14" fill="#ffcfb7">id + versione + hash</text>
<rect x="505" y="120" width="180" height="100" rx="16" fill="#303d50" stroke="#8190a8"/><text x="595" y="164" font-size="21" font-weight="700" fill="#fff">Sintesi LLM</text><text x="595" y="191" font-size="15" fill="#cad3df">con passaggi citati</text>
<rect x="735" y="120" width="230" height="100" rx="16" fill="#ff6b35"/><text x="850" y="164" font-size="21" font-weight="700" fill="#14171e">Verifica</text><text x="850" y="191" font-size="15" fill="#14171e">claim ↔ evidenza</text></g>
<text x="35" y="38" fill="#ff9b75" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">RAG / LA FONTE RESTA IDENTIFICABILE</text>
</svg>
